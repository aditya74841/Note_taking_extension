services:
  - type: web
    name: url-notes-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 30d
      - key: PASSWORD_RESET_TOKEN_EXPIRY_MINUTES
        value: 15
      - key: AUTH_RESET_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
